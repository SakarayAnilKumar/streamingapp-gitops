apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 972011045520.dkr.ecr.us-east-1.amazonaws.com/streaming-frontend:v0.1.0
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: streaming
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
