{{- if .Values.ingress.enabled }}
# --- 1. Auth Ingress ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streaming-ingress-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme | quote }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.targetType | quote }}
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName | quote }}
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/success-codes: '200-399'
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.services.auth.probe.path | quote }}
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds={{ .Values.ingress.idleTimeout }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
  - http:
      paths:
      - path: /api/register
        pathType: Prefix
        backend:
          service:
            name: auth
            port:
              number: {{ .Values.services.auth.port }}
      - path: /api/login
        pathType: Prefix
        backend:
          service:
            name: auth
            port:
              number: {{ .Values.services.auth.port }}
      - path: /api/verify
        pathType: Prefix
        backend:
          service:
            name: auth
            port:
              number: {{ .Values.services.auth.port }}
      - path: /api/forgetPassword
        pathType: Prefix
        backend:
          service:
            name: auth
            port:
              number: {{ .Values.services.auth.port }}
      - path: /api/val
        pathType: Prefix
        backend:
          service:
            name: auth
            port:
              number: {{ .Values.services.auth.port }}
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: auth
            port:
              number: {{ .Values.services.auth.port }}
---
# --- 2. Backend APIs Ingress ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streaming-ingress-apis
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme | quote }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.targetType | quote }}
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName | quote }}
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/success-codes: '200-399'
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.services.streaming.probe.path | quote }}
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds={{ .Values.ingress.idleTimeout }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
  - http:
      paths:
      - path: /api/streaming
        pathType: Prefix
        backend:
          service:
            name: streaming
            port:
              number: {{ .Values.services.streaming.port }}
      - path: /api/admin
        pathType: Prefix
        backend:
          service:
            name: admin
            port:
              number: {{ .Values.services.admin.port }}
      - path: /api/chat
        pathType: Prefix
        backend:
          service:
            name: chat
            port:
              number: {{ .Values.services.chat.port }}
      - path: /api/health
        pathType: Prefix
        backend:
          service:
            name: streaming
            port:
              number: {{ .Values.services.streaming.port }}
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: chat
            port:
              number: {{ .Values.services.chat.port }}
---
# --- 3. Frontend Ingress ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streaming-ingress-frontend
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme | quote }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.ingress.targetType | quote }}
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName | quote }}
    alb.ingress.kubernetes.io/group.order: "30"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/success-codes: '200-399'
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.services.frontend.probe.path | quote }}
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds={{ .Values.ingress.idleTimeout }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: {{ .Values.services.frontend.port }}
{{- end }}