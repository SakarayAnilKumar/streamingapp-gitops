{{- $registry := .Values.global.registry -}}
{{- $secret := .Values.secrets.existingSecretName -}}

# --- Auth Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.services.auth.replicaCount }}
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: "{{ $registry }}/{{ .Values.services.auth.image.repository }}:{{ .Values.services.auth.image.tag }}"
        imagePullPolicy: {{ .Values.services.auth.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.services.auth.port }}
        env:
        - name: PORT
          value: {{ .Values.services.auth.port | quote }}
        - name: CLIENT_URLS
          valueFrom:
            configMapKeyRef:
              name: streamingapp-config
              key: CLIENT_URLS
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: {{ $secret }}
              key: mongo-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $secret }}
              key: jwt-secret
        readinessProbe:
          httpGet:
            path: {{ .Values.services.auth.probe.path }}
            port: {{ .Values.services.auth.port }}
          initialDelaySeconds: {{ .Values.services.auth.probe.initialDelaySeconds }}
          periodSeconds: {{ .Values.services.auth.probe.periodSeconds }}
---
