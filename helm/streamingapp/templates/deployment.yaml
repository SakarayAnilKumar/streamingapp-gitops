{{- range $name, $config := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamingapp-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: streamingapp-{{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: streamingapp-{{ $name }}   # Matching label key/value
  template:
    metadata:
      labels:
        app: streamingapp-{{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.repositoryPrefix }}-{{ $name }}:{{ $.Values.global.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $config.containerPort | default $config.port }}
          envFrom:
            - configMapRef:
                name: streamingapp-config
            - secretRef:
                name: streamingapp-secret # Auto-generated by External Secrets Operator
          resources:
            requests:
              cpu: {{ $config.resources.requests.cpu }}
              memory: {{ $config.resources.requests.memory }}
            limits:
              cpu: {{ $config.resources.limits.cpu }}
              memory: {{ $config.resources.limits.memory }}
            {{- if $.Values.probes.enabled }}
            livenessProbe:
              httpGet:
                path: /health
                port: {{ .port }}
              initialDelaySeconds: 15
              periodSeconds: 10
            readinessProbe:
              httpGet:
                path: /health
                port: {{ .port }}
              initialDelaySeconds: 5
              periodSeconds: 5
            {{- end }}
---
{{- end }}