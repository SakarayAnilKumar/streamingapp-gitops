apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming
  namespace: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streaming
  template:
    metadata:
      labels:
        app: streaming
    spec:
      containers:
      - name: streaming
        image: 972011045520.dkr.ecr.us-east-1.amazonaws.com/streaming-streaming:v0.1.0
        ports:
        - containerPort: 3002
        env:
        - name: PORT
          value: "3002"
        - name: CLIENT_URLS
          value: "http://localhost:3000"
        - name: STREAMING_PUBLIC_URL
          value: "http://localhost:3002"
        - name: AWS_CDN_URL
          value: ""
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: streaming-secrets
              key: mongo-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: streaming-secrets
              key: jwt-secret
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: streaming-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: streaming-secrets
              key: aws-secret-access-key
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: streaming-secrets
              key: aws-region
        - name: AWS_S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: streaming-secrets
              key: aws-s3-bucket
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: streaming
  namespace: streaming
spec:
  selector:
    app: streaming
  ports:
  - port: 3002
    targetPort: 3002
---
